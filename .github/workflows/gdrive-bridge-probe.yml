name: Google Drive Bridge Auth Smoke

on:
  push:
    paths:
      - ".github/workflows/gdrive-bridge-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check Drive credential
        shell: bash
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "${GDRIVE_SERVICE_ACCOUNT_JSON:-}" ]]; then
            echo "::error::Missing required secret: GDRIVE_SERVICE_ACCOUNT_JSON"
            exit 2
          fi
          echo "secret_present=yes"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}'

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify access token
        shell: bash
        run: |
          set -euo pipefail
          token="$(gcloud auth print-access-token)"
          [[ -n "$token" ]]
          echo "::add-mask::$token"
          echo "google_auth=pass"
